name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Put the web app inside the Android app
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html manifest.webmanifest icon-192.png icon-512.png android/app/src/main/assets/www/

      - name: Build the APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk HastRekha.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HastRekha-apk
          path: HastRekha.apk

      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: Hast Rekha app ${{ github.run_number }}
          body: |
            Android app for the Hast Rekha Palm Reader.
            Download HastRekha.apk below, open it on your phone and tap Install.
            If Android asks, allow installs from this source (your browser or Files app).
          files: HastRekha.apk
          make_latest: true
